<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Contact - Mon mini-site</title>
    </head>
<body>
    <h1>Page de contact</h1>
    <nav>
       <a href="index.html">acceuil</a>
        <a href="presentation.html" target="_blank">Presentation</a>
        <a href="contact.html">conctact</a>
    </nav>

    <h2>Formulaire de conctact</h2>
    <p>Veuiller remplir ce formulaire pour envoyer un message</p>

    <form>
        <label for="nom">Nom: </label>
        <input type="text" id="nom" name="nom" placeholder="Entrer votre nom" required>
        <br>
        <br>
        <label for="Prenom">prenom: </label>
        <input type="text" id="prenom" name="prenom" placeholder="Entrer votre prenom">
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="text" id="email" name="Email" placeholder="exemple@email.com" required>
        <br>
        <br>
        <label for="telephone">telephone</label>
        <input type="tel" id="telephone" name="telephone" placeholder="+237 6 XX XX XX XX">
        <br>
        
        <label for="domaine">Domaine d'interet</label>
        <br>
        <select name="domaine" id="domaine" required>
            <option value=""></option>
            <option value="réseaux">Réseaux informatique</option>
            <option value="cybersécurité">cybersécurité
            </option>
            <option value="develeoppement-web">develeoppement web</option>
            <option value="Administration-systeme">Administration système
            </option>
        </select>
        <br>
        <p>statut du visiteur: </p>
        <input type="radio" id="etudiant" name="etudiant" value="etudiant" required>
        <label for="etudiant">etudiant</label>
        <br>
        <input type="radio" id="professionnel" name="professionnel" value="professionnel" required>
        <label for="professionnel">professionnel</label>
        <br>
        <label for="message">message: </label>
        <br>
        <textarea name="message" id="message" rows="5" cols="40" placeholder="ecrivez votre message ici" required></textarea>
        <br>
        <br>
        <input type="checkbox" name="confirmation" id="confirmation" required>
        <label for="confirmation">je confirme que les informations sont correctes</label>
        <br>
        <br>
        <button type="submit">envoyer</button>
    </form>

</body>
</html>
